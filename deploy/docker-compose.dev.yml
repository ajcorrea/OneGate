# Ambiente de desenvolvimento: PostgreSQL da plataforma.
# docker compose -f deploy/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onegate
      POSTGRES_PASSWORD: onegate
      POSTGRES_DB: onegate
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dev-initdb:/docker-entrypoint-initdb.d:ro
volumes:
  pgdata:
