! ONE GATE — laboratório: Arista vEOS-lab (Management1 ligado à Cloud1 do EVE)
! Cole no modo de configuração (enable → configure). Chave = a de credenciais-lab.txt.
hostname lab-arista
!
! Conta de emergência local: vale se o Edge estiver fora do ar
username emergencia privilege 15 role network-admin secret OneGate-Emergencia-2026
!
interface Management1
   ip address 10.99.0.2/24
!
management ssh
   no shutdown
!
management telnet
   no shutdown
!
tacacs-server host 10.99.0.10 key 0 OneGate-Lab-Chave-2026
ip tacacs source-interface Management1
!
aaa group server tacacs+ ONEGATE
   server 10.99.0.10
!
aaa authentication login default group ONEGATE local
! Console sempre local: nunca se trancar fora do laboratório
aaa authentication login console local
aaa authorization exec default group ONEGATE local
aaa authorization commands all default group ONEGATE local
aaa accounting exec default start-stop group ONEGATE
aaa accounting commands all default start-stop group ONEGATE
!
end
write memory
