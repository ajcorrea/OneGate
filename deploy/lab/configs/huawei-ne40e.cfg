# ONE GATE — laboratório: Huawei NE40E (VRP 8, mesma configuração de HWTACACS do NE8000)
# MODELO A VALIDAR: confira o nome da interface de gerência com "display interface brief".
# Cole em "system-view" e finalize com "commit" (VRP 8 usa confirmação de configuração).
sysname lab-ne40e
#
interface GigabitEthernet0/0/0
 undo shutdown
 ip address 10.99.0.1 255.255.255.0
#
hwtacacs-server template onegate
 hwtacacs-server authentication 10.99.0.10 49
 hwtacacs-server authorization 10.99.0.10 49
 hwtacacs-server accounting 10.99.0.10 49
 hwtacacs-server source-ip 10.99.0.1
 hwtacacs-server shared-key cipher OneGate-Lab-Chave-2026
 # O usuário vai sem "@domínio": o Huawei usaria o domínio para escolher o esquema AAA.
 # O técnico digita só "suporte.n1" e o Edge completa o domínio do cliente.
 undo hwtacacs-server user-name domain-included
#
aaa
 local-user emergencia password irreversible-cipher OneGate-Emergencia-2026
 local-user emergencia service-type ssh telnet terminal
 local-user emergencia level 3
 authentication-scheme onegate
  authentication-mode hwtacacs local
 authorization-scheme onegate
  authorization-mode hwtacacs local
  authorization-cmd 3 hwtacacs local
 accounting-scheme onegate
  accounting-mode hwtacacs
 recording-scheme onegate
  recording-mode hwtacacs onegate
 cmd recording-scheme onegate
 domain default_admin
  authentication-scheme onegate
  authorization-scheme onegate
  accounting-scheme onegate
  hwtacacs-server onegate
#
user-interface vty 0 4
 authentication-mode aaa
 protocol inbound all
#
telnet server enable
stelnet server enable
ssh authentication-type default password
#
commit
